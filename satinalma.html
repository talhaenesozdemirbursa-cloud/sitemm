<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atölye3D - Siparişi Tamamla</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#0070f3',
                            600: '#0051cc',
                            700: '#0040a8',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/85 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="anasayfasatin.html" class="flex items-center gap-2 group">
                <div class="w-10 h-10 rounded-xl bg-brand-500 flex items-center justify-center text-white shadow-lg shadow-brand-500/30">
                    <i class="fa-solid fa-cube text-lg"></i>
                </div>
                <span class="text-2xl font-extrabold tracking-tight text-gray-900">Atölye<span class="text-brand-500">3D</span></span>
            </a>
            <a href="anasayfasatin.html" class="text-sm font-semibold text-gray-600 hover:text-brand-500 transition-colors">
                <i class="fa-solid fa-arrow-left mr-1"></i> Alışverişe Geri Dön
            </a>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-8">Siparişi Tamamla</h1>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <!-- Sol Taraf: Adres ve Ödeme Formu -->
            <div class="lg:col-span-7 space-y-8">
                
                <!-- Adres Bilgileri Bölümü -->
                <div class="bg-white p-6 sm:p-8 rounded-3xl border border-gray-100 shadow-sm space-y-6">
                    <div class="flex items-center gap-3 border-b border-gray-100 pb-4">
                        <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand-500 flex items-center justify-center font-bold">1</div>
                        <h2 class="text-xl font-bold text-gray-900">Teslimat Adresi</h2>
                    </div>

                    <div id="checkout-form" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Ad Soyad</label>
                            <input type="text" id="FullName" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Telefon Numarası</label>
                            <input type="tel" id="Phone" required placeholder="05XXXXXXXXX" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500">
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">E-posta Adresi</label>
                            <input type="email" id="Email" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500">
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Açık Adres (Mahalle, Cadde, Sokak, No)</label>
                            <textarea id="Address" rows="3" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Ödeme Yöntemi Bölümü -->
                <div class="bg-white p-6 sm:p-8 rounded-3xl border border-gray-100 shadow-sm space-y-6">
                    <div class="flex items-center gap-3 border-b border-gray-100 pb-4">
                        <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand-500 flex items-center justify-center font-bold">2</div>
                        <h2 class="text-xl font-bold text-gray-900">Ödeme Bilgileri</h2>
                    </div>

                    <div class="space-y-4">
                        <div class="flex items-center gap-4 p-4 border border-brand-500 bg-brand-50/50 rounded-2xl cursor-pointer">
                            <input type="radio" name="payment" checked class="w-4 h-4 text-brand-500">
                            <span class="font-semibold text-sm text-gray-900"><i class="fa-solid fa-credit-card mr-2 text-brand-500"></i> Kredi / Banka Kartı</span>
                        </div>

                        <div class="space-y-4 pt-2">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Kart Üzerindeki İsim</label>
                                <input type="text" placeholder="Ad Soyad" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Kart Numarası</label>
                                <input type="text" placeholder="XXXX XXXX XXXX XXXX" maxlength="19" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Son Kullanma Tarihi</label>
                                    <input type="text" placeholder="AA/YY" maxlength="5" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">CVV</label>
                                    <input type="password" placeholder="XXX" maxlength="3" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Sağ Taraf: Sepet Özeti ve Siparişi Tamamla Butonu -->
            <div class="lg:col-span-5">
                <div class="bg-white p-6 sm:p-8 rounded-3xl border border-gray-100 shadow-sm space-y-6 sticky top-28">
                    <h3 class="font-bold text-lg text-gray-900 border-b border-gray-100 pb-4">Sipariş Özeti</h3>

                    <!-- Ürün Listesi Dinamik Gelecek -->
                    <div id="checkout-cart-items" class="space-y-4 max-h-64 overflow-y-auto pr-1">
                        <!-- Javascript ile doldurulacak -->
                    </div>

                    <div class="border-t border-gray-100 pt-4 space-y-2">
                        <div class="flex justify-between text-sm text-gray-500">
                            <span>Ara Toplam</span>
                            <span id="sub-total">0.00 ₺</span>
                        </div>
                        <div class="flex justify-between text-sm text-gray-500">
                            <span>Kargo Ücreti</span>
                            <span id="shipping-fee" class="font-semibold text-gray-900">0.00 ₺</span>
                        </div>
                        <div class="flex justify-between font-bold text-lg text-gray-900 pt-2 border-t border-gray-100">
                            <span>Toplam</span>
                            <span id="checkout-total" class="text-brand-500">0.00 ₺</span>
                        </div>
                    </div>

                    <button type="button" id="complete-btn" class="w-full py-4 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-2xl shadow-xl shadow-brand-500/25 transition-all text-center cursor-pointer">
                        Siparişi Onayla ve Tamamla
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Toast Bildirimi -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-900 text-white px-6 py-3 rounded-2xl shadow-xl flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-brand-500 text-lg"></i>
        <span id="toast-message" class="text-sm font-medium">İşlem başarılı!</span>
    </div>

    <!-- Firebase SDK Entegrasyonu, Firestore ve Satın Alma Mantığı -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPLv0-onaIMbHIDvnVEBz7MGk2rR6E5j0",
            authDomain: "atolye3d-55902.firebaseapp.com",
            projectId: "atolye3d-55902",
            storageBucket: "atolye3d-55902.firebasestorage.app",
            messagingSenderId: "839537894620",
            appId: "1:839537894620:web:b24c20c3a744cb29e94019",
            measurementId: "G-ZB1LCH5QH1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let cart = [];
        let orders = [];
        let currentCartKey = 'cart_guest';
        let currentOrdersKey = 'orders_guest';
        let currentUserUid = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserUid = user.uid;
                currentCartKey = 'cart_' + user.uid;
                currentOrdersKey = 'orders_' + user.uid;
            } else {
                currentUserUid = null;
                currentCartKey = 'cart_guest';
                currentOrdersKey = 'orders_guest';
            }

            // Sepeti okurken hem kullanıcıya özel anahtarı hem de genel 'cart' anahtarını kontrol ediyoruz
            cart = JSON.parse(localStorage.getItem(currentCartKey)) || JSON.parse(localStorage.getItem('cart')) || [];
            orders = JSON.parse(localStorage.getItem(currentOrdersKey)) || [];
            
            renderCheckoutCart();
        });

        window.renderCheckoutCart = function() {
            const container = document.getElementById('checkout-cart-items');
            const subTotalEl = document.getElementById('sub-total');
            const shippingFeeEl = document.getElementById('shipping-fee');
            const totalEl = document.getElementById('checkout-total');

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-center py-6 text-sm">Sepetinizde ürün bulunmuyor.</p>`;
                subTotalEl.textContent = '0.00 ₺';
                shippingFeeEl.textContent = '0.00 ₺';
                totalEl.textContent = '0.00 ₺';
                return;
            }

            container.innerHTML = '';
            let subTotal = 0;

            cart.forEach(item => {
                subTotal += item.price * item.quantity;
                container.innerHTML += `
                    <div class="flex items-center justify-between text-sm">
                        <div>
                            <p class="font-bold text-gray-900">${item.name}</p>
                            <p class="text-xs text-gray-500">${item.quantity} adet x ${item.price} ₺</p>
                        </div>
                        <span class="font-semibold text-gray-900">${(item.price * item.quantity).toFixed(2)} ₺</span>
                    </div>
                `;
            });

            let shippingFee = 0;
            if (subTotal < 400 && subTotal > 0) {
                shippingFee = 80;
                shippingFeeEl.textContent = '80.00 ₺';
                shippingFeeEl.className = 'font-semibold text-gray-900';
            } else {
                shippingFee = 0;
                shippingFeeEl.textContent = 'Ücretsiz';
                shippingFeeEl.className = 'font-semibold text-green-600';
            }

            let finalTotal = subTotal + shippingFee;

            subTotalEl.textContent = subTotal.toFixed(2) + ' ₺';
            totalEl.textContent = finalTotal.toFixed(2) + ' ₺';
        }

        async function completeOrder() {
            const fullName = document.getElementById('FullName').value.trim();
            const phone = document.getElementById('Phone').value.trim();
            const email = document.getElementById('Email').value.trim();
            const address = document.getElementById('Address').value.trim();

            if (!fullName || !phone || !email || !address) {
                showNotification('Lütfen tüm adres bilgilerini eksiksiz doldurun!');
                return;
            }

            if (cart.length === 0) {
                showNotification('Sepetiniz boş!');
                return;
            }

            let subTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            let shippingFee = subTotal < 400 && subTotal > 0 ? 80 : 0;
            let finalTotal = subTotal + shippingFee;

            const newOrder = {
                id: Math.floor(100000 + Math.random() * 900000),
                userId: currentUserUid || 'guest',
                date: new Date().toLocaleDateString('tr-TR') + ' ' + new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'}),
                items: [...cart],
                subTotal: subTotal,
                shippingFee: shippingFee,
                total: finalTotal,
                shippingAddress: { fullName, phone, email, address },
                status: 'Sipariş Alındı'
            };

            try {
                // 1. Firestore veritabanına kaydet
                await addDoc(collection(db, "orders"), newOrder);

                // 2. Yerel geçmişe kaydet
                orders.unshift(newOrder);
                localStorage.setItem(currentOrdersKey, JSON.stringify(orders));
                
                // 3. Sepetleri temizle
                localStorage.removeItem(currentCartKey);
                localStorage.removeItem('cart');

                showNotification('Siparişiniz başarıyla alındı ve veritabanına kaydedildi!');
                
                setTimeout(() => {
                    window.location.href = 'anasayfasatin.html'; 
                }, 2000);

            } catch (error) {
                console.error("Sipariş kaydedilirken hata oluştu: ", error);
                showNotification('Sipariş kaydedilemedi, lütfen tekrar deneyin.');
            }
        }

        document.getElementById('complete-btn').addEventListener('click', completeOrder);

        window.showNotification = function(message) {
            const toast = document.getElementById('toast');
            const messageEl = document.getElementById('toast-message');
            messageEl.textContent = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
